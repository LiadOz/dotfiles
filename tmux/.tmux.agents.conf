# Agent-aware windows. Sourced from .tmux.conf.
#
# Agents run on an LSF exec host and cannot reach this tmux server, so they
# write state to shared storage and agent-sync (started below) is the only
# thing that touches tmux. State lives in ~/.local/state/agent-slots, which
# on the LSF setup must be storage both machines can see.
#
# Running an agent needs no launcher setup. Every session records its inherited
# tmux server and pane ids; agent-sync maps that identity to the current window.
#
# BLOCK needs you   DONE finished, unseen   WORK running   IDLE quiet   FREE reusable
# DONE clears when you select the window. BLOCK does not -- only answering does.

# Re-sourcing refreshes the daemon as well as the formats. The bracketed
# pattern matches any resolved agent-sync path without matching this shell.
run-shell -b '\
  sync="$HOME/.local/bin/agent-sync"; \
  server="#{pid}"; \
  pkill -u "$(id -u)" -f "[a]gent-sync\$" 2>/dev/null || true; \
  pkill -u "$(id -u)" -f "[a]gent-sync daemon ${server}\$" 2>/dev/null || true; \
  sleep 0.2; \
  mkdir -p "$HOME/.local/state/agent-slots"; \
  "$sync" daemon "$server" >>"$HOME/.local/state/agent-slots/sync.log" 2>&1 &'

# Hooks from the old focus-based mapper survive `source-file` unless they are
# explicitly removed.
set-hook -gu client-active
set-hook -gu after-select-window
set-hook -gu after-select-pane

# --- status bar ---------------------------------------------------------
# Same formats as .tmux.conf, except that on an agent window the letter and
# icon REPLACE the window name rather than being appended to it. The window
# is called "claude" already, so the state word stands in for the name.
# Which agent it is is not shown: it does not change what you do next.
#
# Deliberately plain ASCII. ◆ ✓ ● look right in a browser but U+25C6 and
# U+25CF are east-asian-width Ambiguous, which kitty renders double-width --
# they read as emoji in the bar. These also dodge every character #F already
# uses: * current, - last, # activity, ! bell, ~ silence.
#
#   BLOCK needs you    DONE finished, unseen    WORK running    IDLE quiet    FREE reusable

setw -g window-status-format ' #[fg=colour131]#I#[fg=colour238]:#{?@agent_state,#{?#{==:#{@agent_state},blocked},#[fg=colour203]BLOCK,#{?#{==:#{@agent_state},done},#[fg=colour107]DONE,#{?#{==:#{@agent_state},working},#[fg=colour215]WORK,#{?#{==:#{@agent_state},free},#[fg=colour180]FREE,#[fg=colour245]IDLE}}}}#{?window_active,*,#{?window_last_flag,-,}},#{?#{==:#{pane_current_command},claude},#{?#{==:#{@agent_state},blocked},#[fg=colour203]BLOCK,#{?#{==:#{@agent_state},done},#[fg=colour107]DONE,#{?#{==:#{@agent_state},working},#[fg=colour215]WORK,#[fg=colour245]IDLE}}}#{?window_active,*,#{?window_last_flag,-,}},#{?#{==:#{pane_current_command},codex},#{?#{==:#{@agent_state},blocked},#[fg=colour203]BLOCK,#{?#{==:#{@agent_state},done},#[fg=colour107]DONE,#{?#{==:#{@agent_state},working},#[fg=colour215]WORK,#[fg=colour245]IDLE}}}#{?window_active,*,#{?window_last_flag,-,}},#[fg=colour180]#W#F}}} '
setw -g window-status-current-format ' #[fg=colour131]#I#[fg=colour238]:#{?@agent_state,#{?#{==:#{@agent_state},blocked},#[fg=colour203]BLOCK,#{?#{==:#{@agent_state},done},#[fg=colour107]DONE,#{?#{==:#{@agent_state},working},#[fg=colour215]WORK,#{?#{==:#{@agent_state},free},#[fg=colour180]FREE,#[fg=colour245]IDLE}}}}#{?window_active,*,#{?window_last_flag,-,}},#{?#{==:#{pane_current_command},claude},#{?#{==:#{@agent_state},blocked},#[fg=colour203]BLOCK,#{?#{==:#{@agent_state},done},#[fg=colour107]DONE,#{?#{==:#{@agent_state},working},#[fg=colour215]WORK,#[fg=colour245]IDLE}}}#{?window_active,*,#{?window_last_flag,-,}},#{?#{==:#{pane_current_command},codex},#{?#{==:#{@agent_state},blocked},#[fg=colour203]BLOCK,#{?#{==:#{@agent_state},done},#[fg=colour107]DONE,#{?#{==:#{@agent_state},working},#[fg=colour215]WORK,#[fg=colour245]IDLE}}}#{?window_active,*,#{?window_last_flag,-,}},#[fg=colour230]#W#F}}} '


# --- palette -------------------------------------------------------------
# Warm ember: red-family, but dark maroon rather than the bright red it
# replaced. One place to change the look; overrides .tmux.conf, so this file
# must be sourced after it.
#
# Each window in the list carries its own colour -- the index brick, plain
# names wheat, agent states their own -- so the middle of the bar reads as
# something rather than a grey run.
set -g @p_base   colour237
set -g @p_panel  colour52
set -g @p_index  colour131
set -g @p_name   colour180
set -g @p_bright colour230
set -g @p_block  colour203
set -g @p_work   colour215
set -g @p_done   colour107
set -g @p_idle   colour245
set -g @p_free   colour180

# status-bg as well as status-style: .tmux.conf sets the deprecated
# status-bg alias, and it wins over status-style. Setting only status-style
# leaves the bar rendering at whatever status-bg says.
set -g status-bg colour237
set -g status-style 'bg=colour237'
setw -g window-status-style 'fg=colour180 bg=colour237'
setw -g window-status-current-style 'fg=colour230 bg=colour52 bold'
setw -g window-status-activity-style 'fg=colour148 bg=colour237 bold'
setw -g window-status-bell-style 'fg=colour230 bg=colour124 bold'
set -g message-style 'fg=colour230 bg=colour52'
set -g message-command-style 'fg=colour230 bg=colour52'

# Thin borders. heavy read as chunky; the colour is what marks the active
# pane, not the weight.
#
# Dimming inactive panes is on trial. .tmux.conf disables it -- tmux re-emits
# these backgrounds on every redraw and fought the TUI apps -- but that
# predates tmux 3.4 and used a wider gap than this. Watch claude, codex and
# vim for smeared or wrong background colours, especially after a resize or
# when scrolling. To drop it without touching the file:
#     tmux set -gu window-style \; set -gu window-active-style
# Three surfaces:
#   inactive panes 234 (#1c1c1c) | active pane 235 (#262626) | bar 237 (#3a3a3a)
# The bar sits above the panes, not below -- near-black read as a void.
set -g window-style 'bg=colour234'
set -g window-active-style 'bg=colour235'
set -g pane-border-lines single
set -g pane-border-style 'fg=colour237'
set -g pane-active-border-style 'fg=colour167 bold'

# Defaults matter: before agent-sync's first pass these are unset, and an
# unset option is not "0", so the conditionals below would show an empty count.
set -g @agent_blocked 0
set -g @agent_done 0

# status-left: current window, then a compact branch without its owner prefix.
set -g status-left '#[fg=colour230,bg=colour52,bold] #W #[fg=colour52,bg=colour237,nobold]#[fg=colour174,bg=colour237] #{=12:#{s|^[^/]*/||:@agent_branch}} '

# status-right: BLOCK/DONE counts across every window, then a short host. The
# counts keep working once the window list is too long to read. Zeros hide.
set -g status-right '#{?#{!=:#{@agent_blocked},0},#[fg=colour203]#[bg=colour237] #{@agent_blocked} blocked ,}#{?#{!=:#{@agent_done},0},#[fg=colour107]#[bg=colour237] #{@agent_done} done ,}#[fg=colour52,bg=colour237]#[fg=colour230,bg=colour52] #{=5:host_short} '

# --- keys ---------------------------------------------------------------

# prefix f -- the one window picker. Overrides the plain fzf switcher in
# .tmux.conf: same job, but agent windows sort to the top and the pane
# contents show in a preview, so a permission prompt can be read without
# leaving it.
bind-key f display-popup -E -w 90% -h 85% "env TERM=xterm-256color agent-pick"

# prefix g -- reuse one dedicated shell window in this agent's worktree.
# Existing shells stay alive; only their directory changes.
#
# @agent_cwd, not #{pane_current_path}: this pane is running blaunch, whose
# cwd is wherever you launched from rather than where the agent is working.
bind-key g run-shell '\
  session="#{session_name}"; \
  cwd="#{?@agent_cwd,#{@agent_cwd},#{pane_current_path}}"; \
  target=$(tmux show-options -qv -t "$session" @agent_git_window); \
  found=$(tmux display-message -p -t "$target" "##{window_id}" 2>/dev/null); \
  if [ -n "$target" ] && [ "$found" = "$target" ]; then \
    tmux send-keys -l -t "$target" "cd -- \"$cwd\""; \
    tmux send-keys -t "$target" C-m; \
  else \
    target=$(tmux new-window -d -P -F "##{window_id}" -t "$session:" \
      -c "$cwd" -n agent-git); \
    tmux set-option -t "$session" @agent_git_window "$target"; \
  fi; \
  tmux select-window -t "$target"'

# prefix G -- same, but you choose what runs first.
bind-key G command-prompt -p "run in worktree:" \
  "new-window -c '#{?@agent_cwd,#{@agent_cwd},#{pane_current_path}}' -n git '%1; exec zsh'"

# prefix X -- forget every agent session associated with this pane.
bind-key X run-shell '~/.local/bin/agent-sync clear #{pid} #{pane_id}'
